<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Snake Game with Dev Options</title>
  <style>
    body {
      background-color: #222;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    #game-container {
      text-align: center;
      position: relative;
    }
    canvas {
      border: 3px solid #fff;
      background-color: #000;
      margin-top: 10px;
    }
    .input-section {
      margin-bottom: 15px;
    }
    input {
      padding: 8px 12px;
      font-size: 16px;
      border-radius: 4px;
      border: 1px solid #ccc;
      outline: none;
    }
    button {
      padding: 8px 16px;
      font-size: 16px;
      border-radius: 4px;
      border: none;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
      font-weight: bold;
      margin: 2px;
    }
    button:hover {
      background-color: #45a049;
    }
    button.dev-btn {
      background-color: #ff9800;
    }
    button.dev-btn:hover {
      background-color: #e68a00;
    }
    #score-board {
      margin-top: 10px;
      font-size: 18px;
    }
    
    /* 리더보드 스타일 */
    #leaderboard {
      margin-top: 15px;
      background: #333;
      padding: 10px 20px;
      border-radius: 8px;
      width: 360px;
      box-sizing: border-box;
    }
    #leaderboard ol {
      text-align: left;
      padding-left: 20px;
      margin: 5px 0;
    }

    /* 개발자 옵션 모달 창 */
    .modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #2c2c2c;
      border: 2px solid #ff9800;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      z-index: 100;
      width: 280px;
    }
    .modal h3 {
      margin-top: 0;
      color: #ff9800;
    }
    .modal-content {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
  </style>
</head>
<body>

<div id="game-container">
  <h1>🐍 Snake Game</h1>
  
  <div class="input-section">
    <input type="text" id="player-name" placeholder="플레이어 이름 입력" maxlength="10">
    <button id="start-btn">게임 시작</button>
    <button id="toggle-dev-btn" class="dev-btn">개발자 옵션</button>
  </div>

  <div id="score-board">
    현재 플레이어: <span id="current-player">-</span> | 점수: <span id="score">0</span>
  </div>

  <canvas id="gameCanvas" width="400" height="400"></canvas>

  <!-- 리더보드 -->
  <div id="leaderboard">
    <h3>🏆 리더보드</h3>
    <ol id="leaderboard-list"></ol>
  </div>

  <!-- 개발자 옵션 모달 창 -->
  <div id="dev-modal" class="modal">
    <h3>⚙️ 개발자 옵션</h3>
    <div class="modal-content">
      <div id="dev-auth-section">
        <!-- type="password"로 마스킹 처리 (* 표시) -->
        <input type="password" id="dev-password" placeholder="비밀번호 입력">
        <button id="auth-btn">인증</button>
      </div>
      <div id="dev-controls-section" style="display: none;">
        <button id="add-score-btn">현재 점수 즉시 등록</button>
        <button id="close-dev-btn" style="background-color: #f44336;">닫기</button>
      </div>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  const nameInput = document.getElementById("player-name");
  const startBtn = document.getElementById("start-btn");
  const currentPlayerDisplay = document.getElementById("current-player");
  const scoreDisplay = document.getElementById("score");
  const leaderboardList = document.getElementById("leaderboard-list");

  // 개발자 옵션 관련 엘리먼트
  const toggleDevBtn = document.getElementById("toggle-dev-btn");
  const devModal = document.getElementById("dev-modal");
  const devPasswordInput = document.getElementById("dev-password");
  const authBtn = document.getElementById("auth-btn");
  const devAuthSection = document.getElementById("dev-auth-section");
  const devControlsSection = document.getElementById("dev-controls-section");
  const addScoreBtn = document.getElementById("add-score-btn");
  const closeDevBtn = document.getElementById("close-dev-btn");

  const DEV_PASSWORD = "1018"; // 개발자 비밀번호 설정

  const gridSize = 20;
  const tileCount = canvas.width / gridSize;

  let snake = [];
  let food = { x: 0, y: 0 };
  let dx = gridSize;
  let dy = 0;
  let score = 0;
  let gameInterval = null;
  let isPlaying = false;
  let leaderboard = [];

  // 방향키 컨트롤
  window.addEventListener("keydown", (e) => {
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
      e.preventDefault();
    }
    if (!isPlaying) return;

    if (e.key === "ArrowLeft" && dx === 0) { dx = -gridSize; dy = 0; }
    if (e.key === "ArrowUp" && dy === 0) { dx = 0; dy = -gridSize; }
    if (e.key === "ArrowRight" && dx === 0) { dx = gridSize; dy = 0; }
    if (e.key === "ArrowDown" && dy === 0) { dx = 0; dy = gridSize; }
  });

  nameInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") initGame();
  });

  startBtn.addEventListener("click", initGame);

  // --- 개발자 옵션 기능 ---
  toggleDevBtn.addEventListener("click", () => {
    if (devModal.style.display === "block") {
      closeDevModal();
    } else {
      devModal.style.display = "block";
    }
  });

  authBtn.addEventListener("click", () => {
    if (devPasswordInput.value === DEV_PASSWORD) {
      alert("개발자 인증 성공!");
      devAuthSection.style.display = "none";
      devControlsSection.style.display = "flex";
      devPasswordInput.value = "";
    } else {
      alert("비밀번호가 틀렸습니다.");
      devPasswordInput.value = "";
    }
  });

  addScoreBtn.addEventListener("click", () => {
    const name = currentPlayerDisplay.textContent;
    if (name === "-") {
      alert("게임이 시작되지 않았습니다.");
      return;
    }
    registerLeaderboard(name, score);
    alert(`${name}의 현재 점수(${score}점)를 리더보드에 등록했습니다.`);
  });

  closeDevBtn.addEventListener("click", closeDevModal);

  function closeDevModal() {
    devModal.style.display = "none";
    devAuthSection.style.display = "block";
    devControlsSection.style.display = "none";
    devPasswordInput.value = "";
  }
  // -------------------------

  function initGame() {
    const name = nameInput.value.trim();
    if (!name) {
      alert("이름을 입력해라!");
      return;
    }

    if (gameInterval) clearInterval(gameInterval);

    currentPlayerDisplay.textContent = name;
    score = 0;
    scoreDisplay.textContent = score;
    
    snake = [
      { x: 160, y: 200 },
      { x: 140, y: 200 },
      { x: 120, y: 200 }
    ];
    
    dx = gridSize;
    dy = 0;
    isPlaying = true;

    spawnFood();
    nameInput.value = "";

    gameInterval = setInterval(gameLoop, 100);
  }

  function gameLoop() {
    if (checkGameOver()) {
      clearInterval(gameInterval);
      isPlaying = false;
      const playerName = currentPlayerDisplay.textContent;
      alert(`게임 오버! ${playerName}의 최종 점수: ${score}`);
      registerLeaderboard(playerName, score);
      return;
    }

    clearCanvas();
    drawFood();
    moveSnake();
    drawSnake();
  }

  function registerLeaderboard(name, score) {
    leaderboard.push({ name, score });
    // 점수 높은 순으로 정렬
    leaderboard.sort((a, b) => b.score - a.score);
    // 상위 10명만 유지
    leaderboard = leaderboard.slice(0, 10);
    updateLeaderboardUI();
  }

  function updateLeaderboardUI() {
    leaderboardList.innerHTML = "";
    leaderboard.forEach((entry) => {
      const li = document.createElement("li");
      li.textContent = `${entry.name}: ${entry.score}점`;
      leaderboardList.appendChild(li);
    });
  }

  function clearCanvas() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function drawSnake() {
    snake.forEach((part, index) => {
      ctx.fillStyle = index === 0 ? "#81C784" : "#4CAF50";
      ctx.fillRect(part.x, part.y, gridSize - 2, gridSize - 2);
    });
  }

  function moveSnake() {
    const head = { x: snake[0].x + dx, y: snake[0].y + dy };
    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreDisplay.textContent = score;
      spawnFood();
    } else {
      snake.pop();
    }
  }

  function spawnFood() {
    food.x = Math.floor(Math.random() * tileCount) * gridSize;
    food.y = Math.floor(Math.random() * tileCount) * gridSize;

    snake.forEach(part => {
      if (part.x === food.x && part.y === food.y) spawnFood();
    });
  }

  function drawFood() {
    ctx.fillStyle = "#FF5252";
    ctx.fillRect(food.x, food.y, gridSize - 2, gridSize - 2);
  }

  function checkGameOver() {
    const head = snake[0];

    const hitLeft = head.x < 0;
    const hitRight = head.x >= canvas.width;
    const hitTop = head.y < 0;
    const hitBottom = head.y >= canvas.height;

    if (hitLeft || hitRight || hitTop || hitBottom) return true;

    for (let i = 1; i < snake.length; i++) {
      if (head.x === snake[i].x && head.y === snake[i].y) return true;
    }

    return false;
  }
</script>

</body>
</html>
